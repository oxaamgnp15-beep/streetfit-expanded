version: "3.9"
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streetfit
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: streetauth
      MINIO_ROOT_PASSWORD: streets3secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  create-bucket:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 streetauth streets3secret &&
      mc mb -p local/streetfit || true && mc anonymous set download local/streetfit"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: [.env.example]
    environment: [NODE_ENV=development]
    depends_on: [db, redis, minio, create-bucket]
    ports: ["4000:4000"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file: [.env.example]
    depends_on: [api]
    ports: ["3000:3000"]

  coach:
    build:
      context: .
      dockerfile: infra/docker/coach-py.Dockerfile
    env_file: [.env.example]
    ports: ["5000:5000"]

volumes:
  db-data: {}
  redis-data: {}
  minio-data: {}
